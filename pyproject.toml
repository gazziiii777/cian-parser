[project]
name = "cian-watch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "camoufox[geoip]>=0.5.8",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pygelf>=0.4.3",
    "sqlalchemy[asyncio]>=2.1.4",
]

[project.scripts]
cian-watch = "cian_watch.main:run"
cian-watch-users = "cian_watch.users_cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cian_watch", "config"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TRY", "G", "LOG", "S", "RUF100"]
ignore = ["TRY003"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[[tool.mypy.overrides]]
module = "pygelf.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.19",
    "ruff>=0.15",
]
